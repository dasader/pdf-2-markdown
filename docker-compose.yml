services:
  web:
    build: .
    image: pdf2md:latest          # web·worker 동일 이미지 1벌만 빌드(저디스크)
    ports:                        # command 없음 → Dockerfile의 CMD(uvicorn) 사용
      - "${PDF2MD_PORT:-8001}:8001"
    volumes:
      - ./data:/data
    environment:
      PDF2MD_ADMIN_KEY: "${PDF2MD_ADMIN_KEY:-}"
      PDF2MD_SEC_PER_PAGE: "${PDF2MD_SEC_PER_PAGE:-1.5}"
      # 업로드 검증 값이라 web만 읽는다(worker는 이미 통과한 잡만 본다).
      # 기본값이 config.py와 여기 두 곳에 있다 — 바꿀 땐 같이 바꾼다. ${VAR:-기본값}
      # 형태여야 .env에 키만 있고 값이 빈 줄도 int() 예외 없이 기본값으로 떨어진다.
      PDF2MD_MAX_PAGES: "${PDF2MD_MAX_PAGES:-1000}"
      PDF2MD_MIN_TEXT_CHARS: "${PDF2MD_MIN_TEXT_CHARS:-10}"
    mem_limit: 2g
    restart: unless-stopped

  worker:
    build: .
    image: pdf2md:latest          # web와 같은 이미지 재사용
    command: python -m app.worker
    volumes:
      - ./data:/data
    # 실측 peak: 11p 2.0GB / 51p 2.6GB / 178p·표87개 3.9GB(그림 크롭 포함).
    # 3g면 178p 보고서가 OOM으로 죽는다. 한 페이지에 이미지 객체가 수십만 개인
    # 병리적 문서는 6.1GB를 써 5g로도 못 살린다 — worker가 재시도 없이 실패시킨다.
    mem_limit: 5g
    # memswap_limit 미지정 시 도커가 mem_limit×2(=10g)를 잡는다 — 호스트 swap이
    # 4GB뿐이라 못 쓰는 천장인 데다, 변환이 swap으로 밀리면 워커 1개짜리 큐가
    # 통째로 몇 배 느려진다. mem_limit와 같은 값 = swap 금지. 5GB를 넘으면
    # 느리게 끌지 말고 즉시 OOM → worker가 재시도 없이 failed 처리(위 주석과 같다).
    memswap_limit: 5g
    restart: unless-stopped
